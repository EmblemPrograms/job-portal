<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" fill="none" role="img" aria-label="Job search illustration">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- decorative blobs -->
  <circle cx="430" cy="90" r="70" fill="#c7d2fe" opacity="0.55"/>
  <circle cx="70" cy="330" r="52" fill="#a7f3d0" opacity="0.55"/>
  <circle cx="470" cy="330" r="12" fill="#fbbf24"/>
  <circle cx="60" cy="70" r="8" fill="#818cf8"/>
  <path d="M400 360 l10 0 M405 355 l0 10" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>

  <!-- back job card -->
  <g filter="url(#s)">
    <rect x="120" y="70" width="270" height="150" rx="18" fill="url(#g1)"/>
  </g>
  <rect x="145" y="98" width="54" height="54" rx="14" fill="#ffffff" opacity="0.95"/>
  <path d="M162 125 h20 M172 115 v20" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
  <rect x="215" y="104" width="120" height="14" rx="7" fill="#ffffff" opacity="0.95"/>
  <rect x="215" y="128" width="150" height="10" rx="5" fill="#ffffff" opacity="0.6"/>
  <rect x="145" y="172" width="90" height="26" rx="13" fill="#a7f3d0"/>
  <rect x="245" y="172" width="70" height="26" rx="13" fill="#ffffff" opacity="0.35"/>

  <!-- front job card -->
  <g filter="url(#s)">
    <rect x="90" y="200" width="260" height="150" rx="18" fill="url(#g2)" stroke="#e0e7ff" stroke-width="1"/>
  </g>
  <rect x="112" y="226" width="46" height="46" rx="12" fill="#4f46e5"/>
  <path d="M126 249 h18 M135 240 v18" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="172" y="230" width="130" height="12" rx="6" fill="#334155"/>
  <rect x="172" y="252" width="95" height="9" rx="4.5" fill="#94a3b8"/>
  <rect x="112" y="292" width="150" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="112" y="312" width="110" height="9" rx="4.5" fill="#cbd5e1"/>
  <rect x="278" y="300" width="52" height="30" rx="15" fill="#059669"/>
  <path d="M291 315 l6 6 l11 -12" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- magnifying glass -->
  <g filter="url(#s)">
    <circle cx="360" cy="255" r="46" fill="#ffffff" stroke="#4f46e5" stroke-width="10"/>
  </g>
  <line x1="393" y1="288" x2="430" y2="325" stroke="#4338ca" stroke-width="14" stroke-linecap="round"/>
  <path d="M345 255 a15 15 0 0 1 15 -15" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
